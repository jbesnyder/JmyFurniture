<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jmy Furniture</title>
  <style>
    /* -----------------------------
       EASY-TO-EDIT STYLE VARIABLES
    ----------------------------- */
    :root {
      --bg-color: #f4f4f4;
      --text-color: #111;
      --accent-color: #333;

      /* Fonts */
      --title-font: 'Arial Black', sans-serif;
      --frame-font: 'Helvetica', sans-serif;

      /* Layout */
      --left-width: 33%;
      --transition-speed: 0.35s;
      --thumbnail-size: 64px;
    }

    body {
      flex-direction: column;
      margin: 0;
      display: flex;
      height: 100vh;
      background: var(--bg-color);
      color: var(--text-color);
      overflow: hidden;
      font-family: var(--frame-font);
    }

    /* -----------------------------
       TOP BAR
    ----------------------------- */
    #topbar {
      width: 100%;
      padding: 10px 25px;
      font-family: var(--title-font);
      font-size: 1.5rem;
      background: transparent;
      color: #000;
      box-sizing: border-box;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #contact-info {
      font-family: var(--frame-font);
      font-size: 0.75rem;
      font-weight: 300;
      text-align: right;
      line-height: 1.4;
    }

    /* -----------------------------
       CONTENT: SIDEBAR + FRAME
    ----------------------------- */
    #content {
      display: flex;
      flex-grow: 1;
      height: 100%;
    }

    #sidebar {
      width: var(--left-width);
      padding: 30px;
      background: var(--bg-color);
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 2px;
      box-sizing: border-box;
      overflow: hidden;
    }

    .project {
      font-family: var(--title-font);
      font-size: 1rem;
      letter-spacing: 1px;
      cursor: pointer;
      transition: color var(--transition-speed), font-size var(--transition-speed);
      user-select: none;
      display: flex;
      align-items: center;
      gap: 8px;
      outline: none;
    }
    .project:hover,
    .project:focus {
      color: var(--accent-color);
    }

    /* -----------------------------
       RIGHT IMAGE FRAME
    ----------------------------- */
    #frame {
      flex-grow: 1;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      padding-top: 20px;
      box-sizing: border-box;
      flex-direction: column;
    }

    #display {
      margin-top: 0;
      max-width: 90%;
      max-height: 80%;
      object-fit: contain;
      border-radius: 8px;
      transition: opacity var(--transition-speed);
      display: block;
      will-change: opacity;
    }

    #thumbnails {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-top: 12px;
      max-width: 90%;
      padding-bottom: 6px;
      transition: opacity var(--transition-speed);
    }

    #thumbnails img {
      width: var(--thumbnail-size);
      height: var(--thumbnail-size);
      object-fit: cover;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.25s ease;
      border: 2px solid transparent;
    }
    #thumbnails img:hover { 
      transform: scale(1.03); 
    }
    #thumbnails img.active { 
      box-shadow: 0 4px 10px rgba(0,0,0,0.12); 
      border-color: var(--accent-color); 
    }

    /* Description box */
    .description {
      display: inline-block;
      position: relative;
      opacity: 0;
      margin-left: 6px;
      font-size: 0.9rem;
      font-family: Helvetica, Arial, sans-serif;
      font-weight: 300;
      line-height: 1.2;
      white-space: nowrap;
      transition: opacity var(--transition-speed);
      max-width: 300px;
      overflow: hidden;
    }

    .description.show {
      opacity: 1;
    }

    .description-inner {
      display: inline-block;
      white-space: nowrap;
    }

    .description-inner.scrolling {
      animation: descScroll 10s linear infinite;
    }

    @keyframes descScroll {
      0%, 10% { 
        transform: translateX(0); 
      }
      90%, 100% { 
        transform: translateX(calc(100% - 300px)); 
      }
    }

    .divider {
      border: none;
      border-top: 1px solid #bbb;
      margin: 8px 0;
      opacity: 0.6;
    }

    /* Responsive tweak */
    @media (max-width: 800px) {
      :root { 
        --left-width: 45%; 
      }
      #display { 
        max-height: 60%; 
      }
      #sidebar { 
        padding: 18px; 
      }
    }
  </style>
</head>
<body>
  <h1 id="topbar">
    <span>Jmy Furniture</span>
    <div id="contact-info">
      Jacob Snyder<br>
      (401) 601-5428<br>
      jacob.snyder008@gmail.com
    </div>
  </h1>
  <hr class="divider">
  <div id="content">
    <div id="sidebar">
      

      <div class="project" tabindex="0" data-images="images/Twist02.jpg, images/Twist01.jpg" data-desc="2023 - Bittersweet vine and steel.">BitterSweetLamp</div>
      <div class="project" tabindex="0" data-images="images/Desklamp01.jpg, images/DeskLamp02.jpg, images/Desklamp03.jpg" data-desc="2023 - Beech, cherry and porcelin.">DeskLamp</div>
      <div class="project" tabindex="0" data-images="images/Deity01.jpg, images/Deity02.jpg, images/Deity03.jpg, images/Deity04.jpg, images/Deity05.gif" data-desc="2024 - Oak, silk and metal bits.">DeityLamp</div>
      <div class="project" tabindex="0" data-images="images/BeechLamp01.jpg" data-desc="2023 - Beech, Cherry and Beech leaves.">BeechLamp</div>
      <hr class="divider">
      <div class="project" tabindex="0" data-images="images/tree01.jpg, images/tree02.jpg, images/tree03.jpg" data-desc="2024 - Cypress and boxwood.">appleTreeChair</div>
      <div class="project" tabindex="0" data-images="images/tiles01.jpg, images/tiles02.jpg, images/tiles03.jpg, images/tiles04.jpg" data-desc="2025 - Steel tube and pine.">TileChair</div>
      <div class="project" tabindex="0" data-images="images/draft01.jpg" data-desc="2023 - Walnut and Steel.">DraftingDesk+Stool</div>
      <div class="project" tabindex="0" data-images="images/Bench01.jpg, images/Bench02.jpg" data-desc="2023 - Pine log and a Radiator.">SolsticeBench</div>
      <hr class="divider">
      <div class="project" tabindex="0" data-images="images/Garbage01.jpg" data-desc="2025 - Oak and acrylic.">GarbageCan</div>
      <div class="project" tabindex="0" data-images="images/Dovetails01.jpg, images/Dovetails02.jpg, images/Dovetails03.jpg, images/Dovetails04.jpg" data-desc="2024 - Red cedar.">Dovetails</div>
      <div class="project" tabindex="0" data-images="images/CandleGuards01.jpg, images/CandleGuards2.jpg, images/Candle03.jpg" data-desc="2025 - Boxwood.">CandleBowl</div>
      <div class="project" tabindex="0" data-images="images/basket01.jpg, images/Basket02.jpg, images/Basket03.jpg" data-desc="2025 - Oak and Paduk.">Basket</div>
      <hr class="divider">
      <div class="project" tabindex="0" data-images="images/steel01.jpg, images/steel02.jpg, images/steel03.jpg, images/steel04.jpg, images/steel05.jpg, images/steel06.jpg" data-desc="2025.">SheetChair</div>
      <div class="project" tabindex="0" data-images="images/cab01.png, images/cab02.png, images/cab03.png" data-desc="2025.">ILostSomthingOfMine</div>
    </div>

    <div id="frame">
      <img id="display" src="" alt="Furniture project display" />
      <div id="thumbnails"></div>
    </div>
  </div>

  <script>
    // Timing constants
    const TIMINGS = {
      GLOBAL_SLIDESHOW: 3000,
      PROJECT_SLIDESHOW: 2500,
      RESUME_DELAY: 1000,
      FADE_TRANSITION: 200,
      SCROLL_DELAY: 1000
    };

    const display = document.getElementById('display');
    const thumbnailsContainer = document.getElementById('thumbnails');

    // Image error handling
    display.addEventListener('error', () => {
      console.warn('Failed to load image:', display.src);
      display.style.opacity = 0.3;
    });

    function parseImagesFromProject(el) {
      const raw = el.getAttribute('data-images') || el.getAttribute('data-image') || '';
      if (!raw) return [];
      return raw.split(',').map(s => s.trim()).filter(Boolean);
    }

    const projects = Array.from(document.querySelectorAll('.project'));
    const images = projects.flatMap(p => parseImagesFromProject(p));

    let slideshow = null;
    let resumeTimeout = null;
    let projectSlideshow = null;
    let shuffledImages = [];
    let currentImageIndex = 0;
    let isManualMode = false;
    let manualImageIndex = 0;
    let activeProject = null;
    let activeProjectImages = [];

    function shuffleArray(array) {
      const shuffled = [...array];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    function showImage(src) {
      if (!src) return;
      display.style.opacity = 0;
      setTimeout(() => {
        display.src = src;
        display.alt = `Furniture project: ${src.split('/').pop().split('.')[0]}`;
        display.style.opacity = 1;
      }, TIMINGS.FADE_TRANSITION);
    }

    function showRandomImage() {
      if (!images.length) return;
      
      // If we've shown all images, reshuffle
      if (currentImageIndex >= shuffledImages.length) {
        shuffledImages = shuffleArray(images);
        currentImageIndex = 0;
      }
      
      showImage(shuffledImages[currentImageIndex]);
      currentImageIndex++;
    }

    function startSlideshow() {
      if (isManualMode) return;
      stopSlideshow();
      showRandomImage();
      slideshow = setInterval(showRandomImage, TIMINGS.GLOBAL_SLIDESHOW);
    }

    function stopSlideshow() {
      if (slideshow) { 
        clearInterval(slideshow); 
        slideshow = null; 
      }
    }

    function stopProjectSlideshow() {
      if (projectSlideshow) { 
        clearInterval(projectSlideshow); 
        projectSlideshow = null; 
      }
    }

    function toggleManualMode() {
      isManualMode = !isManualMode;
      
      if (isManualMode) {
        // Pause all slideshows
        stopSlideshow();
        stopProjectSlideshow();
        
        // If we're in a project, use project images, otherwise use global images
        if (activeProject) {
          const imgs = parseImagesFromProject(activeProject);
          activeProjectImages = imgs;
          // Find current image index in project images
          const currentSrc = display.src.split('/').pop();
          manualImageIndex = imgs.findIndex(img => img.includes(currentSrc));
          if (manualImageIndex === -1) manualImageIndex = 0;
        } else {
          activeProjectImages = [];
          // Set current image as starting point for manual navigation
          const currentSrc = display.src.split('/').pop();
          manualImageIndex = shuffledImages.findIndex(img => img.includes(currentSrc));
          if (manualImageIndex === -1) {
            manualImageIndex = currentImageIndex > 0 ? currentImageIndex - 1 : 0;
          }
        }
      } else {
        // Resume slideshow
        if (activeProject) {
          // Restart project slideshow
          const imgs = parseImagesFromProject(activeProject);
          if (imgs.length > 0) {
            let idx = manualImageIndex;
            projectSlideshow = setInterval(() => {
              idx = (idx + 1) % imgs.length;
              showImage(imgs[idx]);
              const thumbs = thumbnailsContainer.querySelectorAll('img');
              thumbs.forEach((t, i) => t.classList.toggle('active', i === idx));
            }, TIMINGS.PROJECT_SLIDESHOW);
          }
        } else {
          startSlideshow();
        }
      }
    }

    function navigateManual(direction) {
      if (!isManualMode) return;
      
      // Use project images if in a project, otherwise use global shuffled images
      const imagesToUse = activeProjectImages.length > 0 ? activeProjectImages : shuffledImages;
      if (!imagesToUse.length) return;
      
      if (direction === 'left') {
        manualImageIndex = (manualImageIndex - 1 + imagesToUse.length) % imagesToUse.length;
      } else if (direction === 'right') {
        manualImageIndex = (manualImageIndex + 1) % imagesToUse.length;
      }
      
      showImage(imagesToUse[manualImageIndex]);
      
      // Update thumbnail active state if in project mode
      if (activeProjectImages.length > 0) {
        const thumbs = thumbnailsContainer.querySelectorAll('img');
        thumbs.forEach((t, i) => t.classList.toggle('active', i === manualImageIndex));
      }
    }

    function buildThumbnails(imgs, activeIdx = 0) {
      thumbnailsContainer.innerHTML = '';
      imgs.forEach((src, i) => {
        const t = document.createElement('img');
        t.src = src;
        t.alt = `Thumbnail ${i + 1}`;
        if (i === activeIdx) t.classList.add('active');
        t.addEventListener('click', () => {
          showImage(src);
          thumbnailsContainer.querySelectorAll('img').forEach(img => img.classList.remove('active'));
          t.classList.add('active');
        });
        thumbnailsContainer.appendChild(t);
      });
    }

    function clearThumbnails() {
      thumbnailsContainer.innerHTML = '';
    }

    function showDescription(project) {
      let desc = project.querySelector('.description');
      if (!desc) {
        desc = document.createElement('span');
        desc.className = 'description';
        
        const inner = document.createElement('span');
        inner.className = 'description-inner';
        inner.textContent = project.getAttribute('data-desc') || 'Description coming soon.';
        
        desc.appendChild(inner);
        project.appendChild(desc);
      }
      
      const inner = desc.querySelector('.description-inner');
      desc.classList.add('show');
      inner.classList.remove('scrolling');

      setTimeout(() => {
        const descWidth = desc.offsetWidth;
        const innerWidth = inner.scrollWidth;
        
        if (innerWidth > descWidth) {
          inner.classList.add('scrolling');
        }
      }, 500);
    }

    function hideDescription(project) {
      const desc = project.querySelector('.description');
      if (desc) {
        desc.classList.remove('show');
        const inner = desc.querySelector('.description-inner');
        if (inner) {
          inner.classList.remove('scrolling');
        }
      }
    }

    function activateProject(project) {
      if (isManualMode) return; // Don't activate projects in manual mode
      
      if (resumeTimeout) { 
        clearTimeout(resumeTimeout); 
        resumeTimeout = null; 
      }

      activeProject = project;
      project.style.fontSize = '1.4rem';
      showDescription(project);

      stopSlideshow();
      stopProjectSlideshow();

      const imgs = parseImagesFromProject(project);
      if (!imgs.length) return;

      showImage(imgs[0]);
      buildThumbnails(imgs, 0);

      let idx = 0;
      projectSlideshow = setInterval(() => {
        idx = (idx + 1) % imgs.length;
        showImage(imgs[idx]);
        const thumbs = thumbnailsContainer.querySelectorAll('img');
        thumbs.forEach((t, i) => t.classList.toggle('active', i === idx));
      }, TIMINGS.PROJECT_SLIDESHOW);
    }

    function deactivateProject(project) {
      if (isManualMode) return; // Don't deactivate in manual mode
      
      activeProject = null;
      activeProjectImages = [];
      project.style.fontSize = '1rem';
      hideDescription(project);
      
      stopProjectSlideshow();

      if (resumeTimeout) clearTimeout(resumeTimeout);
      resumeTimeout = setTimeout(() => {
        clearThumbnails();
        startSlideshow();
      }, TIMINGS.RESUME_DELAY);
    }

    // Attach hover and keyboard behavior to projects
    projects.forEach(project => {
      project.addEventListener('mouseenter', () => activateProject(project));
      project.addEventListener('mouseleave', () => deactivateProject(project));
      
      // Keyboard accessibility
      project.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          activateProject(project);
        }
      });
      
      project.addEventListener('blur', () => {
        deactivateProject(project);
      });
    });

    // Global keyboard controls
    document.addEventListener('keydown', (e) => {
      // Space bar toggles manual mode
      if (e.code === 'Space' && e.target === document.body) {
        e.preventDefault();
        toggleManualMode();
      }
      
      // Arrow keys for manual navigation
      if (isManualMode) {
        if (e.key === 'ArrowLeft') {
          e.preventDefault();
          navigateManual('left');
        } else if (e.key === 'ArrowRight') {
          e.preventDefault();
          navigateManual('right');
        }
      }
    });

    // Start the global slideshow on load
    if (images.length > 0) {
      startSlideshow();
    } else {
      console.warn('No images found in projects');
    }
  </script>
</body>
</html>
